plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
}

android {
    compileSdk 34
    namespace("com.auvehassan.composeessentials")
    defaultConfig {
        applicationId "com.auvehassan.composeessentials"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.4.3'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation "androidx.compose.ui:ui:1.6.7"
    implementation "androidx.compose.material3:material3:1.2.1"
    implementation "androidx.compose.ui:ui-tooling-preview:1.6.7"
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.1'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation "androidx.compose.material:material-icons-extended:1.6.7"
    implementation 'androidx.compose.ui:ui-text-google-fonts:1.6.7'
    implementation 'androidx.emoji2:emoji2-views:1.4.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose-android:2.8.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose-android:2.8.1'
    implementation 'androidx.window:window-core-android:1.3.0'
    implementation 'androidx.compose.animation:animation-graphics-android:1.6.7'
    implementation 'androidx.media3:media3-common:1.3.1'
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.paging:paging-common-android:3.3.0'
    implementation 'androidx.compose.material3:material3-adaptive-android:1.0.0-alpha06'
    implementation 'androidx.constraintlayout:constraintlayout-compose-android:1.1.0-alpha13'
    implementation 'androidx.compose.runtime:runtime-livedata:1.6.7'
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    implementation 'androidx.graphics:graphics-shapes-android:1.0.0-beta01'
    implementation 'androidx.glance:glance-appwidget:1.0.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
//    androidTestImplementation "androidx.compose.ui:ui-test-junit4:$compose_version"
//    debugImplementation "androidx.compose.ui:ui-tooling:$compose_version"
//    debugImplementation "androidx.compose.ui:ui-test-manifest:$compose_version"

    implementation(platform("androidx.compose:compose-bom:2024.05.00"))

    implementation("io.coil-kt:coil-compose:2.6.0")

    implementation("androidx.paging:paging-runtime-ktx:3.3.0")
    implementation("androidx.paging:paging-compose:3.3.0")

}